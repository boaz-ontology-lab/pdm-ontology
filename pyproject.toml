[project]
name = "pdm-ontology"
version = "0.1.0"
description = "Azure 예지 정비 데이터 위에 온톨로지와 데이터 거버넌스 계층을 얹는 미니 프로젝트"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=40.63.0",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
