# name이 3자보다 짧으면 GitHub이 템플릿을 조용히 무시한다
name: 버그 제보
description: "기대와 다르게 동작하는 것"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: "응답 JSON, 에러 메시지, 로그"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: "브랜치, 커밋, 기준 시각 설정"
