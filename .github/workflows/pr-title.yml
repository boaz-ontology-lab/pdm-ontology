name: PR title

# Squash merge를 하면 PR 제목이 main의 커밋 메시지가 되므로, 제목이 커밋 규칙을 따르는지 검사한다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            spec
          scopes: |
            data
            db
            ontology
            engine
            action
            policy
            api
            clock
            infra
          requireScope: false
